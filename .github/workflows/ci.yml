name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsqlite3-dev libcurl4-openssl-dev sqlite3
      - name: Build
        run: make
      - name: Test
        run: make test
